version: '3.8'

services:
  # Database service
  db:
    image: postgres:15
    container_name: marketplace_db
    environment:
      POSTGRES_DB: marketplace
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI application service
  api:
    build: .
    container_name: marketplace_api
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/marketplace
      SECRET_KEY: your-secret-key-change-in-production
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Database migration service (optional)
  alembic:
    build: .
    container_name: marketplace_alembic
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/marketplace
    depends_on:
      db:
        condition: service_healthy
    command: alembic upgrade head
    profiles:
      - migration

volumes:
  postgres_data:
